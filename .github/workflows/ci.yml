name: Minimal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-mock

      - name: Prepare executable scripts
        run: chmod +x scripts/db_manage.sh

      - name: Init local DB with Alembic
        env:
          DATABASE_URL: sqlite:///./runtime_data/jobs.db
        run: |
          rm -f runtime_data/jobs.db
          ./scripts/db_manage.sh init-local

      - name: Run minimal integration tests
        env:
          DATABASE_URL: sqlite:///./runtime_data/jobs.db
        run: pytest -q tests/test_dual_api_integration.py tests/test_worker_pipeline_real_call.py
